user nginx;
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    # 只暴露 HTTPS(§13.1):80 端口不监听,由外层 LB 做 80→443 重定向。
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 80m;  # session 包上传上限略大于 TG_IMPORT_MAX_SIZE_MB

        # Docker 内嵌 DNS + 变量目标:后端容器重启期间名字解析不到时 nginx 仍
        # 能启动(否则 config 期解析失败 → restart 循环 → 端点断开 → 端口丢发布)
        resolver 127.0.0.11 valid=5s;

        location /api/ {
            set $backend_api http://control-api:8000;
            proxy_pass $backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        location / {
            set $backend_web http://web:80;
            proxy_pass $backend_web;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
