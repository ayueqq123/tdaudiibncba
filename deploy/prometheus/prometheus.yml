global:
  scrape_interval: 30s
  evaluation_interval: 30s

# 指标标签红线(§14.1):不得把 message ID/手机号/用户文本放进标签。
scrape_configs:
  - job_name: control-api
    metrics_path: /metrics
    static_configs:
      - targets: ['control-api:8000']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
